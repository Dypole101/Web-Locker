<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Locker</title><style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background:
        radial-gradient(circle at 10% 10%, #242424, transparent 30%),
        radial-gradient(circle at 90% 90%, #1a1a1a, transparent 30%),
        #000;
}

.screen {
    min-height: 100vh;
    padding: 25px;
}

.login-screen {
    display: flex;
    justify-content: center;
    align-items: center;
}

.box {
    width: 100%;
    max-width: 420px;
    padding: 35px 28px;
    border: 1px solid #333;
    border-radius: 25px;
    background: rgba(15,15,15,.92);
    box-shadow: 0 0 50px rgba(255,255,255,.08);
    text-align: center;
}

.lock {
    font-size: 55px;
    margin-bottom: 15px;
}

h1 {
    letter-spacing: 4px;
}

.subtitle {
    color: #888;
    margin: 10px 0 30px;
}

input {
    width: 100%;
    padding: 15px;
    margin: 8px 0;
    border: 1px solid #333;
    border-radius: 12px;
    background: #090909;
    color: white;
    outline: none;
}

button {
    border: none;
    border-radius: 12px;
    padding: 14px 20px;
    font-weight: bold;
    cursor: pointer;
    background: white;
    color: black;
}

.create {
    width: 100%;
    margin-top: 12px;
    background: #181818;
    color: white;
    border: 1px solid #333;
}

.hidden {
    display: none !important;
}

.message {
    margin-top: 15px;
    color: #aaa;
}


/* DASHBOARD */

.header {
    max-width: 1100px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0 30px;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 3px;
}

.logout {
    background: #181818;
    color: white;
    border: 1px solid #333;
}

.dashboard {
    max-width: 1100px;
    margin: auto;
}

.welcome {
    margin-bottom: 25px;
}

.welcome h2 {
    margin-bottom: 8px;
}

.welcome p {
    color: #777;
}


/* UPLOAD */

.upload {
    border: 1px dashed #444;
    border-radius: 20px;
    padding: 35px;
    text-align: center;
    background: rgba(15,15,15,.8);
    margin-bottom: 30px;
}

.upload-icon {
    font-size: 45px;
    margin-bottom: 10px;
}

.upload p {
    color: #777;
    margin: 8px 0 20px;
}


/* FILE GRID */

.files-title {
    margin-bottom: 15px;
}

.file-grid {
    display: grid;
    grid-template-columns:
        repeat(auto-fill, minmax(180px, 1fr));
    gap: 15px;
}

.file-card {
    background: #101010;
    border: 1px solid #292929;
    border-radius: 18px;
    padding: 20px;
    min-height: 180px;
    cursor: pointer;
    transition: .2s;
}

.file-card:hover {
    transform: translateY(-3px);
    border-color: #555;
}

.file-icon {
    font-size: 40px;
}

.file-name {
    margin-top: 12px;
    word-break: break-word;
}

.file-type {
    color: #666;
    font-size: 13px;
    margin-top: 5px;
}

.delete {
    margin-top: 12px;
    background: #1c1c1c;
    color: #aaa;
    border: 1px solid #333;
    padding: 8px;
    width: 100%;
}


/* VIEWER */

.viewer {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.96);
    z-index: 100;
    padding: 20px;
    display: flex;
    flex-direction: column;
}

.viewer-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.viewer-title {
    max-width: 75%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.close {
    background: #222;
    color: white;
    border: 1px solid #444;
    padding: 10px 15px;
}

.viewer-content {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 0;
}

.viewer-content img {
    max-width: 100%;
    max-height: 90vh;
    object-fit: contain;
    border-radius: 10px;
}

.viewer-content video {
    max-width: 100%;
    max-height: 90vh;
}

.viewer-content iframe {
    width: 100%;
    height: 100%;
    border: none;
    border-radius: 10px;
    background: white;
}

.download {
    margin-top: 12px;
    background: white;
    color: black;
}


/* EMPTY */

.empty {
    color: #666;
    text-align: center;
    padding: 40px;
    border: 1px solid #222;
    border-radius: 18px;
}

@media (max-width: 600px) {

    .screen {
        padding: 15px;
    }

    .logo {
        font-size: 18px;
    }

    .upload {
        padding: 25px 15px;
    }

}
</style></head><body><!-- LOGIN --><div id="loginScreen" class="screen login-screen"><div class="box">

    <div class="lock">🔐</div>

    <h1>MY LOCKER</h1>

    <p class="subtitle">
        Your private digital vault
    </p>

    <input id="loginName"
           type="text"
           placeholder="Username">

    <input id="loginPassword"
           type="password"
           placeholder="Password">

    <button onclick="login()">
        LOGIN
    </button>

    <button class="create"
            onclick="showCreate()">
        CREATE ACCOUNT
    </button>

    <p id="message" class="message"></p>

</div>

</div><!-- CREATE ACCOUNT --><div id="createScreen"
     class="screen login-screen hidden"><div class="box">

    <div class="lock">👤</div>

    <h1>CREATE</h1>

    <p class="subtitle">
        Password must contain at least 8 characters
    </p>

    <input id="newName"
           type="text"
           placeholder="Username">

    <input id="newPassword"
           type="password"
           placeholder="Password">

    <input id="confirmPassword"
           type="password"
           placeholder="Confirm password">

    <button onclick="createAccount()">
        CREATE ACCOUNT
    </button>

    <button class="create"
            onclick="showLogin()">
        BACK TO LOGIN
    </button>

    <p id="createMessage"
       class="message"></p>

</div>

</div><!-- DASHBOARD --><div id="dashboard"
     class="screen hidden"><div class="header">

    <div class="logo">
        🔐 MY LOCKER
    </div>

    <button class="logout"
            onclick="logout()">
        LOGOUT
    </button>

</div>


<div class="dashboard">

    <div class="welcome">

        <h2>
            Welcome, <span id="username"></span>
        </h2>

        <p>
            Your private digital locker
        </p>

    </div>


    <div class="upload">

        <div class="upload-icon">
            ☁️
        </div>

        <h2>Add files</h2>

        <p>
            Photos, videos, PDFs and other files
        </p>

        <input id="fileInput"
               type="file"
               multiple
               hidden
               onchange="addFiles()">

        <button onclick="openFilePicker()">
            + SELECT FILES
        </button>

    </div>


    <h2 class="files-title">
        My Files
    </h2>

    <div id="fileGrid"
         class="file-grid">

        <div class="empty">
            No files yet.
        </div>

    </div>

</div>

</div><!-- FILE VIEWER --><div id="viewer"
     class="viewer hidden"><div class="viewer-top">

    <div id="viewerTitle"
         class="viewer-title">
    </div>

    <button class="close"
            onclick="closeViewer()">
        ✕ CLOSE
    </button>

</div>

<div id="viewerContent"
     class="viewer-content">
</div>

</div><script>

let files = [];


/* ACCOUNT */

function showCreate() {

    document.getElementById("loginScreen")
        .classList.add("hidden");

    document.getElementById("createScreen")
        .classList.remove("hidden");
}


function showLogin() {

    document.getElementById("createScreen")
        .classList.add("hidden");

    document.getElementById("loginScreen")
        .classList.remove("hidden");
}


function createAccount() {

    let name =
        document.getElementById("newName").value.trim();

    let password =
        document.getElementById("newPassword").value;

    let confirm =
        document.getElementById("confirmPassword").value;

    let message =
        document.getElementById("createMessage");


    if (!name || !password || !confirm) {

        message.textContent =
            "Please fill all fields.";

        return;
    }


    if (password.length < 8) {

        message.textContent =
            "Password must be at least 8 characters.";

        return;
    }


    if (password !== confirm) {

        message.textContent =
            "Passwords do not match.";

        return;
    }


    localStorage.setItem(
        "lockerUsername",
        name
    );

    localStorage.setItem(
        "lockerPassword",
        password
    );


    message.textContent =
        "Account created successfully!";


    setTimeout(showLogin, 1000);
}


/* LOGIN */

function login() {

    let name =
        document.getElementById("loginName").value;

    let password =
        document.getElementById("loginPassword").value;

    let savedName =
        localStorage.getItem("lockerUsername");

    let savedPassword =
        localStorage.getItem("lockerPassword");

    let message =
        document.getElementById("message");


    if (name === savedName &&
        password === savedPassword) {

        openDashboard(name);

    } else {

        message.textContent =
            "Wrong username or password.";
    }
}


/* DASHBOARD */

function openDashboard(name) {

    document.getElementById("loginScreen")
        .classList.add("hidden");

    document.getElementById("dashboard")
        .classList.remove("hidden");

    document.getElementById("username")
        .textContent = name;
}


function logout() {

    document.getElementById("dashboard")
        .classList.add("hidden");

    document.getElementById("loginScreen")
        .classList.remove("hidden");
}


/* FILE UPLOAD */

function openFilePicker() {

    document.getElementById("fileInput").click();
}


function addFiles() {

    let selected =
        document.getElementById("fileInput").files;


    for (let file of selected) {

        files.push(file);
    }


    displayFiles();
}


/* DISPLAY FILES */

function displayFiles() {

    let grid =
        document.getElementById("fileGrid");

    grid.innerHTML = "";


    if (files.length === 0) {

        grid.innerHTML =
            '<div class="empty">No files yet.</div>';

        return;
    }


    files.forEach(function(file, index) {

        let card =
            document.createElement("div");

        card.className = "file-card";


        card.onclick = function(event) {

            if (event.target.tagName !== "BUTTON") {
                openFile(file);
            }

        };


        card.innerHTML = `

            <div>

                <div class="file-icon">
                    ${getFileIcon(file)}
                </div>

                <div class="file-name">
                    ${escapeHTML(file.name)}
                </div>

                <div class="file-type">
                    ${escapeHTML(file.type || "File")}
                </div>

            </div>

            <button class="delete"
                    onclick="deleteFile(event, ${index})">
                DELETE
            </button>
        `;


        grid.appendChild(card);

    });
}


/* FILE ICON */

function getFileIcon(file) {

    if (file.type.startsWith("image/"))
        return "🖼️";

    if (file.type.startsWith("video/"))
        return "🎥";

    if (file.type === "application/pdf")
        return "📄";

    return "📁";
}


/* OPEN FILE */

function openFile(file) {

    let viewer =
        document.getElementById("viewer");

    let content =
        document.getElementById("viewerContent");

    let title =
        document.getElementById("viewerTitle");


    viewer.classList.remove("hidden");

    title.textContent = file.name;

    content.innerHTML = "";


    let url =
        URL.createObjectURL(file);


    /* IMAGE */

    if (file.type.startsWith("image/")) {

        let img =
            document.createElement("img");

        img.src = url;

        content.appendChild(img);
    }


    /* VIDEO */

    else if (file.type.startsWith("video/")) {

        let video =
            document.createElement("video");

        video.src = url;
        video.controls = true;
        video.autoplay = true;

        content.appendChild(video);
    }


    /* PDF */

    else if (file.type === "application/pdf") {

        let iframe =
            document.createElement("iframe");

        iframe.src = url;

        content.appendChild(iframe);
    }


    /* OTHER FILE */

    else {

        let text =
            document.createElement("p");

        text.textContent =
            "This file cannot be previewed.";

        let download =
            document.createElement("a");

        download.href = url;
        download.download = file.name;
        download.textContent = "DOWNLOAD FILE";
        download.className = "download";

        download.style.display = "inline-block";
        download.style.padding = "12px 18px";
        download.style.borderRadius = "10px";
        download.style.marginTop = "15px";

        content.appendChild(text);
        content.appendChild(download);
    }
}


/* CLOSE VIEWER */

function closeViewer() {

    let content =
        document.getElementById("viewerContent");

    content.innerHTML = "";

    document.getElementById("viewer")
        .classList.add("hidden");
}


/* DELETE */

function deleteFile(event, index) {

    event.stopPropagation();

    files.splice(index, 1);

    displayFiles();
}


/* SECURITY FOR FILE NAMES */

function escapeHTML(text) {

    let div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}

</script></body>
</html>
